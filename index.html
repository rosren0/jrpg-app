<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Sistema de produtividade gamificado no estilo JRPG — rastreie hábitos, inventário e finanças." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#080c16" />
  <title>JRPG Productivity System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Login overlay (shown before auth) -->
  <div id="login-root"></div>

  <header>
    <div class="header-left">
      <div class="avatar" id="player-avatar">V</div>
      <div class="player-info">
        <div class="player-name" id="player-name">VIAJANTE</div>
        <div class="player-level" id="player-level-header">Nível 1</div>
      </div>
    </div>
    <div class="header-center">
      <div class="header-bar">
        <label>XP</label>
        <div class="bar-track"><div class="bar-fill xp" id="header-xp-bar" style="width:0%"></div></div>
        <span class="bar-values" id="header-xp-values">0 / 100</span>
      </div>
    </div>
    <div class="header-right">
      <div class="datetime" id="datetime"></div>

      <!-- Settings button + dropdown -->
      <div class="settings-wrap" id="settings-wrap">
        <button class="header-icon-btn" id="settings-btn" title="Configurações">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div class="settings-dropdown" id="settings-dropdown">
          <div class="settings-row">
            <span class="settings-label">Tema</span>
            <button class="theme-toggle" id="theme-toggle" title="Alternar tema">
              <span class="theme-toggle-track">
                <span class="theme-toggle-icon theme-icon-moon">🌙</span>
                <span class="theme-toggle-icon theme-icon-sun">☀️</span>
                <span class="theme-toggle-thumb"></span>
              </span>
            </button>
          </div>
          <div class="settings-divider"></div>
          <button class="settings-reset-btn" id="reset-metrics-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
            Resetar Métricas
          </button>
        </div>
      </div>

      <button class="header-icon-btn header-logout" id="logout-btn" title="Sair" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <aside>
    <div class="menu-item active" data-view="overview">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg></span>
      <span class="menu-label">Visão Geral</span>
    </div>
    <div class="menu-item" data-view="skills">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 7l6-6 4 4-6 6M3 21l4-4"/></svg></span>
      <span class="menu-label">Habilidades</span>
    </div>
    <div class="menu-item" data-view="inventory">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg></span>
      <span class="menu-label">Inventário</span>
    </div>
    <div class="menu-item" data-view="finances">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/></svg></span>
      <span class="menu-label">Finanças</span>
    </div>
    <div class="menu-item" data-view="missions">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
      <span class="menu-label">Missões</span>
    </div>
    <div class="menu-item" data-view="tasks">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/></svg></span>
      <span class="menu-label">Kanban</span>
    </div>
    <div class="menu-item" data-view="logs">
      <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></span>
      <span class="menu-label">Logs</span>
    </div>
    <div class="sidebar-spacer"></div>
  </aside>

  <main id="app"></main>

  <div class="context" id="context"></div>

  <!-- Bottom nav for mobile -->
  <nav class="bottom-nav" id="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="bottom-nav-item active" data-view="overview">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg></span>
        <span class="bnav-label">Geral</span>
      </button>
      <button class="bottom-nav-item" data-view="skills">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 7l6-6 4 4-6 6M3 21l4-4"/></svg></span>
        <span class="bnav-label">Skills</span>
      </button>
      <button class="bottom-nav-item" data-view="inventory">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg></span>
        <span class="bnav-label">Itens</span>
      </button>
      <button class="bottom-nav-item" data-view="finances">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/></svg></span>
        <span class="bnav-label">Finanças</span>
      </button>
      <button class="bottom-nav-item" data-view="missions">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        <span class="bnav-label">Missões</span>
      </button>
      <button class="bottom-nav-item" data-view="tasks">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/></svg></span>
        <span class="bnav-label">Kanban</span>
      </button>
      <button class="bottom-nav-item" data-view="logs">
        <span class="bnav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></span>
        <span class="bnav-label">Logs</span>
      </button>
    </div>
  </nav>

  <div id="modal-root"></div>
  <div id="levelup-root"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App scripts -->
  <script>const Views = {};</script>
  <script src="utils/theme.js"></script>
  <script src="utils/supabase-config.js"></script>
  <script src="utils/auth.js"></script>
  <script src="utils/storage.js"></script>
  <script src="utils/xp.js"></script>
  <script src="utils/icons.js"></script>
  <script src="utils/ai.js"></script>
  <script src="utils/notifications.js"></script>
  <script src="utils/export.js"></script>
  <script src="views/overview.js"></script>
  <script src="views/skills.js"></script>
  <script src="views/missions.js"></script>
  <script src="views/inventory.js"></script>
  <script src="views/finances.js"></script>
  <script src="views/logs.js"></script>
  <script src="views/tasks.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
    });
  </script>
</body>
</html>
